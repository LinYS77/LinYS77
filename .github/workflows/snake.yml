name: Update contribution snake

on:
  schedule:
    # Daily at 02:23 UTC; avoid the top of the hour.
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  update-snake:
    # Avoid writing images from forks or running on the generated output branch.
    if: github.repository == 'LinYS77/LinYS77' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        # actions/checkout v7.0.1, pinned to a verified upstream release.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate light and dark SVG animations
        # Platane/snk v3, pinned to the commit verified during setup.
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: LinYS77
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7c3aed&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#30204f,#5b3590,#8951d0,#b895f3

      - name: Publish SVG files to the output branch
        shell: bash
        run: |
          set -euo pipefail

          # Save only the expected generated files before changing branches.
          staging_dir="${RUNNER_TEMP}/profile-snake-files"
          mkdir -p "$staging_dir"
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
          cp -- dist/github-snake.svg dist/github-snake-dark.svg "$staging_dir/"

          # Preserve existing output history. A new output branch is orphaned
          # so the profile source files are never published to that branch.
          output_ref="$(git ls-remote --heads origin refs/heads/output)"
          if [[ -n "$output_ref" ]]; then
            git fetch --no-tags --depth=1 origin refs/heads/output
            git switch -C output FETCH_HEAD
          else
            git switch --orphan output
          fi

          cp -- "$staging_dir/github-snake.svg" "$staging_dir/github-snake-dark.svg" .
          git add -- github-snake.svg github-snake-dark.svg

          if git diff --cached --quiet; then
            echo "The snake images are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contribution snake"
          git push origin HEAD:refs/heads/output
